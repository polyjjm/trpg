<!DOCTYPE html>
<html>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #app-loading {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, #1A1610, #000);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .loading-box {
    width: 280px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(30, 26, 20, 0.72);
    border: 1px solid rgba(240, 230, 140, 0.18);
    text-align: center;
    color: #E2D4BF;
    font-family: Arial, sans-serif;
  }

  .loading-text {
    font-size: 14px;
    margin-bottom: 16px;
    color: rgba(226, 212, 191, 0.92);
  }

  .loading-bar {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }

  .loading-bar-inner {
    width: 40%;
    height: 100%;
    background: #f0e68c;
    border-radius: 999px;
    animation: loadingMove 1.2s infinite ease-in-out;
  }

  @keyframes loadingMove {
    0% {
      margin-left: -40%;
    }
    100% {
      margin-left: 100%;
    }
  }
</style>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Telo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Telo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Toss Payments SDK는 이 메인 앱 문서에는 없다 — 결제 팝업
       (payment_popup_launch.html)이 자기 자신의 컨텍스트에서 따로 로드해서
       쓴다(lib/core/payment/toss_payments_web.dart의 openTossPaymentPopup
       참고). 그래야 결제 흐름이 팝업 창 안에서만 일어나고 이 메인 탭은 결제
       도중 한 번도 이동/새로고침되지 않는다. -->
</head>
<body>
<div id="app-loading">
  <div class="loading-box">
    <div class="loading-text">이야기를 불러오는 중...</div>
    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
