<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TELO 홈 화면 목업 - 모바일</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: #0d0d0c; margin: 0; padding: 40px 20px; color: #F1EFE8; }
  .frame { max-width: 380px; margin: 0 auto; background: #1A1A18; border-radius: 16px; overflow: hidden; }
</style>
</head>
<body>

<div class="frame">

  <div style="position: relative; height: 190px; background: #4A3221; overflow: hidden;">
    <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 4px; padding: 0 4px; opacity: 0.9;">
      <div style="width: 20px; height: 70%; background: #993C1D;"></div>
      <div style="width: 16px; height: 85%; background: #185FA5;"></div>
      <div style="width: 22px; height: 60%; background: #0F6E56;"></div>
      <div style="width: 18px; height: 90%; background: #712B13;"></div>
      <div style="width: 20px; height: 65%; background: #854F0B;"></div>
      <div style="width: 16px; height: 80%; background: #534AB7;"></div>
      <div style="width: 22px; height: 55%; background: #993556;"></div>
      <div style="width: 18px; height: 88%; background: #3B6D11;"></div>
      <div style="width: 20px; height: 68%; background: #993C1D;"></div>
      <div style="width: 16px; height: 82%; background: #0C447C;"></div>
      <div style="width: 22px; height: 58%; background: #712B13;"></div>
      <div style="width: 18px; height: 92%; background: #0F6E56;"></div>
      <div style="width: 20px; height: 62%; background: #534AB7;"></div>
      <div style="width: 16px; height: 78%; background: #993556;"></div>
      <div style="width: 22px; height: 66%; background: #854F0B;"></div>
    </div>
    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, rgba(13,13,12,0.9) 100%);"></div>
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between;">
      <p style="font-family: Georgia, serif; font-size: 22px; margin: 0;">Telo</p>
      <i class="ti ti-search" style="font-size: 19px;"></i>
    </div>
    <div style="position: absolute; bottom: 14px; left: 16px; right: 16px; background: rgba(13,13,12,0.6); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px;">
      <p style="font-size: 12px; margin: 0; flex: 1;">낡은 저택 · 43% 이어읽기</p>
      <i class="ti ti-chevron-right" style="font-size: 14px; color: #83817A;"></i>
    </div>
  </div>

  <div style="padding: 16px;">

    <div style="position: relative; border-radius: 12px; overflow: hidden; margin-bottom: 22px; aspect-ratio: 16/7; background: #2C2C2A;">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #5F5E5A; font-size: 12px;">배너 이미지</div>
      <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(13,13,12,0.55); padding: 3px 10px; border-radius: 12px; font-size: 11px; display: flex; align-items: center; gap: 6px;">
        <i class="ti ti-player-pause" style="font-size: 12px;"></i> 1 / 3
      </div>
    </div>

    <div style="margin-bottom: 24px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
        <p style="font-size: 15px; font-weight: 600; margin: 0;">실시간 랭킹</p>
        <span style="font-size: 11px; color: #83817A;">전체 보기</span>
      </div>
      <div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2C2C2A;">
          <span style="font-size: 18px; font-weight: 600; color: #F0997B; width: 20px;">1</span>
          <div style="width: 40px; aspect-ratio: 3/4; background: #993C1D; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0;">
            <p style="font-size: 13px; margin: 0;">낡은 저택</p>
            <p style="font-size: 11px; color: #83817A; margin: 2px 0 0;">공포 · 인터랙티브</p>
          </div>
          <i class="ti ti-arrow-up" style="font-size: 13px; color: #97C459;"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2C2C2A;">
          <span style="font-size: 18px; font-weight: 600; color: #F0997B; width: 20px;">2</span>
          <div style="width: 40px; aspect-ratio: 3/4; background: #185FA5; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0;">
            <p style="font-size: 13px; margin: 0;">밤의 항해</p>
            <p style="font-size: 11px; color: #83817A; margin: 2px 0 0;">로맨스 · 일반소설</p>
          </div>
          <i class="ti ti-minus" style="font-size: 13px; color: #83817A;"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2C2C2A;">
          <span style="font-size: 18px; font-weight: 600; color: #F0997B; width: 20px;">3</span>
          <div style="width: 40px; aspect-ratio: 3/4; background: #534AB7; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0;">
            <p style="font-size: 13px; margin: 0;">세 갈래 길</p>
            <p style="font-size: 11px; color: #83817A; margin: 2px 0 0;">미스터리 · 인터랙티브</p>
          </div>
          <i class="ti ti-arrow-down" style="font-size: 13px; color: #F09595;"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
          <span style="font-size: 15px; color: #5F5E5A; width: 20px;">4</span>
          <div style="width: 40px; aspect-ratio: 3/4; background: #0F6E56; border-radius: 4px; flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0;">
            <p style="font-size: 13px; margin: 0;">여름의 끝</p>
            <p style="font-size: 11px; color: #83817A; margin: 2px 0 0;">일상 · 일반소설</p>
          </div>
          <span style="font-size: 10px; background: #854F0B; color: #FAEEDA; padding: 2px 6px; border-radius: 8px;">NEW</span>
        </div>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <p style="font-family: Georgia, serif; font-size: 15px; margin: 0 0 10px;">공포</p>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; border-bottom: 3px solid #444441;">
        <div style="position: relative; width: 66px; aspect-ratio: 3/4; background: #993C1D; border-radius: 4px 4px 2px 2px; flex-shrink: 0;">
          <div style="position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #0F6E56;"></div>
        </div>
        <div style="position: relative; width: 66px; aspect-ratio: 3/4; background: #712B13; border-radius: 4px 4px 2px 2px; flex-shrink: 0;">
          <div style="position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #185FA5;"></div>
        </div>
        <div style="position: relative; width: 66px; aspect-ratio: 3/4; background: #4A1B0C; border-radius: 4px 4px 2px 2px; flex-shrink: 0;">
          <div style="position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #0F6E56;"></div>
        </div>
      </div>
    </div>

    <div>
      <p style="font-family: Georgia, serif; font-size: 15px; margin: 0 0 10px;">로맨스</p>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; border-bottom: 3px solid #444441;">
        <div style="position: relative; width: 66px; aspect-ratio: 3/4; background: #993556; border-radius: 4px 4px 2px 2px; flex-shrink: 0;">
          <div style="position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #185FA5;"></div>
        </div>
        <div style="position: relative; width: 66px; aspect-ratio: 3/4; background: #72243E; border-radius: 4px 4px 2px 2px; flex-shrink: 0;">
          <div style="position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #0F6E56;"></div>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; justify-content: space-around; border-top: 1px solid #2C2C2A; padding: 10px 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <i class="ti ti-home" style="font-size: 18px; color: #F0997B;"></i>
      <span style="font-size: 10px; color: #F0997B;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <i class="ti ti-bookmark" style="font-size: 18px; color: #83817A;"></i>
      <span style="font-size: 10px; color: #83817A;">내 서재</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <i class="ti ti-bell" style="font-size: 18px; color: #83817A;"></i>
      <span style="font-size: 10px; color: #83817A;">공지사항</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <i class="ti ti-settings" style="font-size: 18px; color: #83817A;"></i>
      <span style="font-size: 10px; color: #83817A;">설정</span>
    </div>
  </div>

</div>

</body>
</html>
