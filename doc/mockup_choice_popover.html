<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>선택지 생성 팝업 목업</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --surface-1: #f4f3ef;
    --surface-2: #ffffff;
    --surface-3: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a63;
    --text-muted: #9a988f;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --shadow-popover: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #232320;
      --surface-2: #2b2b27;
      --surface-3: #302f2b;
      --text-primary: #f0efe9;
      --text-secondary: #b5b3a9;
      --text-muted: #83817a;
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.2);
      --shadow-popover: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: var(--surface-1); margin: 0; padding: 40px; color: var(--text-primary); }
  input, button {
    font-size: 13px; border-radius: 8px; border: 0.5px solid var(--border);
    background: var(--surface-2); color: var(--text-primary); padding: 8px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--surface-1); }
</style>
</head>
<body>

<div style="min-height: 360px; position: relative; background: var(--surface-1); border-radius: 12px; padding: 40px 20px; max-width: 640px;">
  <div style="position: absolute; top: 60px; left: 30px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 16px; width: 180px;">
    <p style="font-size: 13px; font-weight: 600; margin: 0;">복도 끝에서 낮은...</p>
    <p style="font-size: 11px; color: var(--text-muted); margin: 4px 0 0;">노드 5 · 어두운 복도</p>
  </div>

  <div style="position: absolute; top: 130px; left: 190px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-1); border: 1.5px solid #0F6E56; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #0F6E56;">+</div>

  <div style="position: absolute; top: 90px; left: 250px; width: 300px; background: var(--surface-3); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow-popover);">
    <p style="font-size: 13px; font-weight: 600; margin: 0 0 8px;">선택지 만들기</p>
    <input type="text" placeholder="선택지 문구를 입력하세요" style="width: 100%; margin-bottom: 8px;">
    <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;">
      <button style="font-size: 12px; padding: 4px 10px; border-radius: 14px;">다시 시도</button>
      <button style="font-size: 12px; padding: 4px 10px; border-radius: 14px;">돌아가기</button>
      <button style="font-size: 12px; padding: 4px 10px; border-radius: 14px;">계속하기</button>
    </div>
    <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 8px;">또는 기존 노드에 연결하기</p>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface-1); border-radius: 8px;">
        <div>
          <p style="font-size: 13px; margin: 0;">"거긴 아무것도 없었어..."</p>
          <p style="font-size: 11px; color: var(--text-muted); margin: 2px 0 0;">노드 7 · 조용히 지나간다</p>
        </div>
        <i class="ti ti-link" style="font-size: 15px; color: var(--text-muted);"></i>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface-1); border-radius: 8px;">
        <div>
          <p style="font-size: 13px; margin: 0;">문 뒤에서 발소리가 멈췄다</p>
          <p style="font-size: 11px; color: var(--text-muted); margin: 2px 0 0;">노드 6 · 소리를 듣는다</p>
        </div>
        <i class="ti ti-link" style="font-size: 15px; color: var(--text-muted);"></i>
      </div>
    </div>
  </div>

  <div style="position: absolute; bottom: 20px; left: 30px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted);">
    <i class="ti ti-arrow-move" style="font-size: 14px;"></i>드래그해서 빈 곳에 놓으면 새 노드 생성
  </div>
</div>

</body>
</html>
