<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>새 노드 생성 드래그 목업</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --surface-1: #f4f3ef;
    --surface-2: #ffffff;
    --surface-3: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a63;
    --text-muted: #9a988f;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --shadow-popover: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #232320;
      --surface-2: #2b2b27;
      --surface-3: #302f2b;
      --text-primary: #f0efe9;
      --text-secondary: #b5b3a9;
      --text-muted: #83817a;
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.2);
      --shadow-popover: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: var(--surface-1); margin: 0; padding: 40px; color: var(--text-primary); }
  textarea {
    font-size: 13px; border-radius: 8px; border: 0.5px solid var(--border);
    background: var(--surface-2); color: var(--text-primary); padding: 8px 10px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div style="min-height: 380px; position: relative; background: var(--surface-1); border-radius: 12px; padding: 30px 20px; max-width: 640px;">
  <div style="position: absolute; top: 30px; left: 30px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 16px; width: 170px;">
    <p style="font-size: 13px; font-weight: 600; margin: 0;">복도 끝에서 낮은...</p>
    <p style="font-size: 11px; color: var(--text-muted); margin: 4px 0 0;">노드 5 · 어두운 복도</p>
  </div>

  <div style="position: absolute; top: 60px; left: 210px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-1); border: 1.5px solid #0F6E56; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #0F6E56;">+</div>

  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 640 380">
    <line x1="236" y1="73" x2="440" y2="220" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
  </svg>

  <div style="position: absolute; top: 190px; left: 380px; background: var(--surface-2); border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 12px 16px; width: 160px;">
    <p style="font-size: 12px; color: var(--text-secondary); margin: 0;">여기 놓으면</p>
    <p style="font-size: 12px; color: var(--text-secondary); margin: 2px 0 0;">새 노드 8 생성</p>
  </div>

  <div style="position: absolute; top: 260px; left: 30px; display: flex; align-items: center; gap: 8px; color: var(--text-muted);">
    <i class="ti ti-arrow-down" style="font-size: 16px;"></i>
    <span style="font-size: 12px;">놓는 순간 바로 작성 카드가 열려요</span>
  </div>

  <div style="position: absolute; top: 300px; left: 30px; right: 30px; background: var(--surface-3); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-popover);">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
      <i class="ti ti-door" style="font-size: 15px; color: var(--text-secondary);"></i>
      <p style="font-size: 12px; color: var(--text-secondary); margin: 0;">노드 8 · 새 노드 (노드 5에서 연결됨)</p>
    </div>
    <textarea placeholder="이 노드의 이야기를 적어보세요" rows="1" style="width: 100%; resize: none;"></textarea>
  </div>
</div>

</body>
</html>
